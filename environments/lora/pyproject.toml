[project]
name = "tuniscope-lora"
version = "0.1.0"
description = "Shared Qwen3 LoRA training"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.15.0",
  "transformers==4.57.6",
  "tokenizers==0.22.2",
  "numpy==2.5.4",
  "peft==0.18.0",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
