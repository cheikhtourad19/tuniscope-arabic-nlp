[project]
name = "tuniscope-tokenizer-audit"
version = "0.1.0"
description = "Tokenizer-only inspection without a model runtime or pretrained weights"
requires-python = ">=3.12,<3.13"
dependencies = ["transformers>=4.57,<5", "tokenizers>=0.22,<0.23"]

[tool.uv]
package = false
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
