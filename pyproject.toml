[project]
name = "tuniscope"
version = "0.1.0"
description = "Reproducible Arabic variety identification and Tunisian sentiment analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.6,<2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.7,<2",
    "scipy>=1.13,<2",
    "threadpoolctl>=3.7,<4",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
