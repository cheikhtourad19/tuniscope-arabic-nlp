name: tuniscope
services:
  backend:
    build:
      context: ..
      dockerfile: App/backend/Dockerfile
      args:
        REQUIRE_MODELS: ${REQUIRE_MODELS:-true}
        REQUIRE_NEURAL: ${REQUIRE_NEURAL:-true}
    environment:
      TUNISCOPE_REQUIRE_MODELS: ${REQUIRE_MODELS:-true}
      TUNISCOPE_REQUIRE_NEURAL: ${REQUIRE_NEURAL:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  frontend:
    build:
      context: frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
