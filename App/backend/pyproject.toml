[project]
name = "tuniscope-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "joblib==1.6.0",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "threadpoolctl==3.7.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[project.optional-dependencies]
neural = ["torch==2.15.0", "transformers==4.57.6", "tokenizers==0.22.2", "peft==0.18.0"]

[tool.uv]
package = false
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
