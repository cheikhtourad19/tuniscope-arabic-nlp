[project]
name = "tuniscope-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "joblib==1.6.0",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "threadpoolctl==3.7.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
